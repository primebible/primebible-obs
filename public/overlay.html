<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrimeBible Overlay</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      position: relative;
    }

    .overlay-root {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Safe area support - configurable via URL params */
    .safe-area-applied .theme-glass-lower {
      bottom: calc(4% + var(--safe-area-bottom, 0px));
    }

    .safe-area-applied .theme-ticker {
      bottom: var(--safe-area-bottom, 0px);
    }

    /* High contrast mode */
    .high-contrast .glass-lower-content {
      background: rgba(0, 0, 0, 0.95);
      border-color: #ffffff;
    }

    .high-contrast .glass-lower-verse,
    .high-contrast .glass-lower-ref {
      color: #ffffff;
      text-shadow: 2px 2px 4px #000000;
    }

    /* Improved text wrapping */
    .glass-lower-verse,
    .minimal-center-verse,
    .full-screen-verse,
    .split-side-verse,
    .corner-card-verse {
      text-wrap: balance;
      hyphens: auto;
      -webkit-hyphens: auto;
      -moz-hyphens: auto;
      overflow-wrap: break-word;
      word-wrap: break-word;
    }

    /* ==== GLASS LOWER THIRD ==== */
    .theme-glass-lower {
      position: absolute;
      left: 60px;
      right: 60px;
      bottom: 60px;
      display: flex;
      align-items: flex-end;
    }

    .glass-lower-content {
      width: 100%;
      background: linear-gradient(90deg, 
        rgba(10, 10, 15, 0.95) 0%, 
        rgba(10, 10, 15, 0.85) 40%,
        rgba(10, 10, 15, 0) 100%
      );
      backdrop-filter: blur(40px) saturate(180%);
      border: 2px solid rgba(90, 174, 252, 0.3);
      border-radius: 24px;
      padding: 32px 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7),
                  0 0 100px rgba(90, 174, 252, 0.2);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 32px;
      align-items: end;
    }

    .glass-lower-verse {
      font-size: 36px;
      line-height: 1.4;
      font-weight: 600;
      color: #f5f5f7;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8),
                   0 0 40px rgba(90, 174, 252, 0.3);
      letter-spacing: -0.01em;
    }

    .glass-lower-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      min-width: 280px;
    }

    .glass-lower-ref {
      font-size: 22px;
      font-weight: 700;
      color: #5aaefc;
      text-shadow: 0 2px 10px rgba(90, 174, 252, 0.6);
    }

    .glass-lower-tr {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 999px;
    }

    .glass-lower-slide-indicator {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
    }

    /* ==== MINIMAL CENTER ==== */
    .theme-minimal-center {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 120px;
    }

    .minimal-center-content {
      text-align: center;
      max-width: 1200px;
    }

    .minimal-center-verse {
      font-size: 48px;
      line-height: 1.5;
      font-weight: 400;
      color: #f5f5f7;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
      margin-bottom: 32px;
    }

    .minimal-center-meta {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 600;
    }

    .minimal-center-dot {
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
    }

    /* ==== FULL SCREEN ==== */
    .theme-full-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(10, 10, 15, 0.97), rgba(26, 26, 37, 0.97));
      backdrop-filter: blur(100px);
    }

    .full-screen-content {
      max-width: 1400px;
      padding: 80px;
      text-align: center;
    }

    .full-screen-verse {
      font-size: 56px;
      line-height: 1.5;
      font-weight: 300;
      color: #f5f5f7;
      margin-bottom: 48px;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
    }

    .full-screen-meta {
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: center;
      padding-top: 32px;
      border-top: 2px solid rgba(255, 255, 255, 0.1);
    }

    .full-screen-ref {
      font-size: 28px;
      font-weight: 700;
      color: #5aaefc;
    }

    .full-screen-tr {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
    }

    /* ==== SPLIT SIDE ==== */
    .theme-split-side {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 600px;
      background: linear-gradient(90deg, transparent, rgba(10, 10, 15, 0.97));
      backdrop-filter: blur(40px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 60px;
      border-left: 2px solid rgba(90, 174, 252, 0.3);
    }

    .split-side-meta {
      margin-bottom: 24px;
    }

    .split-side-ref {
      font-size: 24px;
      font-weight: 700;
      color: #5aaefc;
      margin-bottom: 8px;
    }

    .split-side-tr {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
    }

    .split-side-verse {
      font-size: 28px;
      line-height: 1.6;
      font-weight: 400;
      color: #f5f5f7;
      text-shadow: 0 2px 15px rgba(0, 0, 0, 0.6);
    }

    /* ==== CORNER CARD ==== */
    .theme-corner-card {
      position: absolute;
      bottom: 60px;
      right: 60px;
      width: 480px;
    }

    .corner-card-content {
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(40px);
      border: 2px solid rgba(90, 174, 252, 0.3);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    }

    .corner-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .corner-card-ref {
      font-size: 18px;
      font-weight: 700;
      color: #5aaefc;
    }

    .corner-card-tr {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }

    .corner-card-verse {
      font-size: 20px;
      line-height: 1.5;
      color: #f5f5f7;
      font-weight: 400;
    }

    /* ==== TICKER ==== */
    .theme-ticker {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(180deg, transparent, rgba(10, 10, 15, 0.95));
      backdrop-filter: blur(30px);
      border-top: 2px solid rgba(90, 174, 252, 0.3);
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .ticker-track {
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      font-size: 28px;
      font-weight: 600;
      color: #f5f5f7;
      padding-left: 100%;
      animation: ticker-scroll 30s linear infinite;
    }

    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }

    /* ==== ANIMATION STATES ==== */
    .overlay-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Respect reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      .anim-fade,
      .anim-slide-up,
      .anim-slide-down,
      .anim-slide-left,
      .anim-slide-right,
      .anim-zoom {
        transition: opacity 200ms ease !important;
        transform: none !important;
      }

      .ticker-track {
        animation: none !important;
      }
    }

    /* Fade */
    .anim-fade {
      transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Slide Up */
    .anim-slide-up {
      transition: all 500ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .anim-slide-up.overlay-hidden {
      transform: translateY(60px);
    }

    /* Slide Down */
    .anim-slide-down {
      transition: all 500ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .anim-slide-down.overlay-hidden {
      transform: translateY(-60px);
    }

    /* Slide Left */
    .anim-slide-left {
      transition: all 500ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .anim-slide-left.overlay-hidden {
      transform: translateX(60px);
    }

    /* Slide Right */
    .anim-slide-right {
      transition: all 500ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .anim-slide-right.overlay-hidden {
      transform: translateX(-60px);
    }

    /* Zoom */
    .anim-zoom {
      transition: all 500ms cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    .anim-zoom.overlay-hidden {
      transform: scale(0.8);
    }

    /* None */
    .anim-none {
      transition: none !important;
    }
  </style>
</head>
<body>
  <div class="overlay-root" id="root"></div>

  <script src="overlay.js"></script>
</body>
</html>
